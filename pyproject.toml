[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cripto-dt"
version = "0.4.0"
description = "AI/ML cryptocurrency price prediction system"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=12.0",
    "ccxt>=4.0",
    "requests>=2.31",
    "ta>=0.11.0",
    "PyWavelets>=1.4",
    "EMD-signal>=1.5",
    "arch>=7.0",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "hmmlearn>=0.3",
    "boruta>=0.3",
    "torch>=2.0",
    "shap>=0.43",
    "sentence-transformers>=2.2",
    "transformers>=4.30",
    "yfinance>=0.2",
    "optuna>=3.0",
    "gymnasium>=0.29",
    "stable-baselines3>=2.0",
    "matplotlib>=3.7",
    "plotly>=5.15",
    "streamlit>=1.30",
    "feedparser>=6.0",
    "aiohttp>=3.9",
    "tqdm>=4.65",
    "joblib>=1.3",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
    "bandit>=1.7",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
all = [
    "cripto-dt[dev]",
    "cripto-dt[api]",
]

[project.scripts]
cripto-dt = "scripts.run_pipeline:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
