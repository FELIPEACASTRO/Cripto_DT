# =============================================================================
# Cripto DT - Orquestracao de servicos com Docker Compose
# Sistema de previsao de criptomoedas com IA/ML
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # API FastAPI - Servidor principal de previsoes e dados
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cripto-dt-api
    command: >
      uvicorn src.api.server:app
      --host 0.0.0.0
      --port 8000
      --workers 2
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Volumes persistentes para dados, modelos e logs
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    environment:
      - CRYPTOCOMPARE_API_KEY=${CRYPTOCOMPARE_API_KEY:-}
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY:-}
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MODEL_DIR=/app/models
      - DATA_DIR=/app/data
      - PYTHONPATH=/app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ---------------------------------------------------------------------------
  # Dashboard Streamlit - Interface visual para monitoramento
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cripto-dt-dashboard
    command: >
      streamlit run dashboard/app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    volumes:
      # Mesmos volumes compartilhados para leitura de dados e modelos
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    environment:
      - API_HOST=api
      - API_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MODEL_DIR=/app/models
      - DATA_DIR=/app/data
      - PYTHONPATH=/app
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # Worker - Processo em segundo plano para treinamento e previsoes
  # Executa o pipeline completo em ciclos periodicos
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cripto-dt-worker
    command: >
      python scripts/run_realtime.py
      --interval 60
    volumes:
      # Volumes compartilhados para escrita de dados e modelos treinados
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./reports:/app/reports
    environment:
      - CRYPTOCOMPARE_API_KEY=${CRYPTOCOMPARE_API_KEY:-}
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY:-}
      - API_HOST=api
      - API_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MODEL_DIR=/app/models
      - DATA_DIR=/app/data
      - PYTHONPATH=/app
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
